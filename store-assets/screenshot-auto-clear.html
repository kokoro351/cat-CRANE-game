<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=430, initial-scale=1">
    <title>Auto Clear Screenshot</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      body {
        width: 430px;
        min-height: 900px;
      }

      .game-shell {
        width: 430px;
        min-height: 900px;
      }

      .shot-field {
        position: relative;
        width: 390px;
        height: 680px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(#9fd9ff 0 62%, #f6d47c 62% 100%);
        box-shadow: 0 12px 30px rgb(23 33 43 / 12%);
      }

      .rail {
        position: absolute;
        left: -20px;
        right: -20px;
        top: 58px;
        height: 10px;
        background: #263946;
        box-shadow: 0 18px 0 #496270;
      }

      .crane {
        position: absolute;
        left: 144px;
        top: 40px;
        width: 74px;
        height: 36px;
        border-radius: 8px;
        background: var(--accent);
      }

      .rope {
        position: absolute;
        left: 176px;
        top: 72px;
        width: 5px;
        height: 206px;
        background: #17212b;
      }

      .cat {
        position: absolute;
        left: 124px;
        top: 174px;
        width: 160px;
        filter: drop-shadow(0 10px 9px rgb(23 33 43 / 18%));
      }

      .beam {
        position: absolute;
        left: 106px;
        top: 322px;
        width: 184px;
        height: 34px;
        border: 6px solid #445663;
        background: repeating-linear-gradient(90deg, #758692 0 25px, #657580 25px 33px);
      }

      .result-panel {
        left: 32px;
        right: 32px;
      }
    </style>
  </head>
  <body>
    <main class="game-shell play-mode">
      <section class="hud" aria-label="game status">
        <div>
          <p class="label">Distance</p>
          <p><span>0</span>m</p>
        </div>
        <div>
          <p class="label">Swing</p>
          <p><span>24</span>&deg;</p>
        </div>
        <div class="hud-actions">
          <button type="button">Restart</button>
          <button class="secondary" type="button">ステージ</button>
        </div>
      </section>
      <section class="play-area">
        <div class="shot-field">
          <div class="rail"></div>
          <div class="crane"></div>
          <div class="rope"></div>
          <img class="cat" src="../assets/cat-beam-anime.png" alt="">
          <div class="beam"></div>
          <div class="result-panel">
            <h2>Game Over</h2>
            <p>鉄骨がぶつかりました</p>
            <div class="result-actions">
              <button type="button">Restart</button>
              <button class="secondary" type="button">ステージ選択</button>
              <button class="auto-clear" type="button">オートモードでクリアする（広告視聴）</button>
            </div>
          </div>
        </div>
      </section>
      <section class="controls" aria-label="game controls">
        <button class="dir-up" type="button">&uarr;</button>
        <button class="dir-left" type="button">&larr;</button>
        <button class="dir-down" type="button">&darr;</button>
        <button class="dir-right" type="button">&rarr;</button>
      </section>
    </main>
  </body>
</html>
