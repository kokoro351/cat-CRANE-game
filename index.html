<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cat-CRANE</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="cat-CRANE game">
      <section class="hud" aria-label="game status">
        <div>
          <p class="label">Distance</p>
          <p><span id="distance">0</span>m</p>
        </div>
        <div>
          <p class="label">Swing</p>
          <p><span id="swing">0</span>&deg;</p>
        </div>
        <div class="hud-actions">
          <button id="restart" type="button">Restart</button>
          <button id="stage-menu" class="secondary" type="button">ステージ</button>
        </div>
      </section>

      <section class="play-area">
        <canvas id="game" width="390" height="680" aria-label="cat crane play field"></canvas>

        <div id="start-screen" class="screen">
          <img class="title-cat" src="assets/cat-beam-anime.png" alt="">
          <h1>追いノッチ<br><span>-クレーン猫 チャレンジ-</span></h1>
          <div class="menu-actions">
            <button id="tutorial-button" type="button">追いノッチチュートリアル</button>
            <button id="stage-button" type="button">ステージ選択</button>
            <button id="hard-mode-button" class="hard-mode-entry" type="button">ガチノッチ</button>
          </div>
          <a class="privacy-link" href="privacy.html">プライバシーポリシー</a>
        </div>

        <div id="stage-screen" class="screen hidden">
          <h2>ステージ選択</h2>
          <p id="unlock-status" class="unlock-status"></p>
          <div id="stage-grid" class="stage-grid" aria-label="stage list"></div>
          <div class="ending-actions">
            <button id="ending-button" type="button" disabled>エンディング</button>
          </div>
          <button id="stage-back" class="secondary" type="button">タイトルへ</button>
        </div>

        <div id="tutorial-screen" class="screen hidden">
          <div class="story-card">
            <p id="story-kicker">追いノッチチュートリアル</p>
            <h2 id="story-title">シーン 1</h2>
            <p id="story-text"></p>
            <div id="story-visual" class="story-visual"></div>
            <button id="story-next" type="button">次へ</button>
          </div>
        </div>

        <div id="certificate-screen" class="screen certificate-screen hidden">
          <div class="certificate-card">
            <p class="certificate-watermark">thank you for your playing</p>
            <p class="certificate-kicker">修了証</p>
            <h2>ガチノッチ安全教育</h2>
            <dl class="certificate-lines">
              <div>
                <dt>氏名</dt>
                <dd>クレーン猫 挑戦者 殿</dd>
              </div>
              <div>
                <dt>課程</dt>
                <dd>ガチノッチ運転 全10課程</dd>
              </div>
            </dl>
            <p class="certificate-message">貴方は全てのガチノッチを達成しました</p>
            <p class="certificate-date">修了日　本日</p>
            <div class="certificate-seal" aria-hidden="true">ヨシ</div>
            <button id="certificate-back" class="secondary" type="button">ステージ選択へ</button>
          </div>
        </div>

        <div id="demo-label" class="demo-label hidden">見本運転: 右にチョン押し → 揺れを見て右に長押し</div>
        <div id="result-panel" class="result-panel hidden">
          <h2 id="result-title">Goal!</h2>
          <p id="result-text"></p>
          <div class="result-actions">
            <button id="result-restart" type="button">Restart</button>
            <button id="result-stage" class="secondary" type="button">ステージ選択</button>
            <button id="result-auto" class="auto-clear hidden" type="button">オートモードでクリアする</button>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="game controls">
        <button id="up" class="dir-up" type="button" aria-label="move crane up">&uarr;</button>
        <button id="left" class="dir-left" type="button" aria-label="move crane left">&larr;</button>
        <button id="down" class="dir-down" type="button" aria-label="move crane down">&darr;</button>
        <button id="right" class="dir-right" type="button" aria-label="move crane right">&rarr;</button>
        <div id="button-cue" class="button-cue hidden" aria-live="polite"></div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
