<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cat-CRANE</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="cat-CRANE game">
      <section class="hud" aria-label="game status">
        <div>
          <p class="label">Score</p>
          <p id="score">0</p>
        </div>
        <div>
          <p class="label">Time</p>
          <p><span id="time">60</span>s</p>
        </div>
        <button id="restart" type="button">Restart</button>
      </section>

      <canvas id="game" width="390" height="680" aria-label="cat crane play field"></canvas>

      <section class="controls" aria-label="game controls">
        <button id="left" type="button" aria-label="move claw left">Left</button>
        <button id="drop" type="button" aria-label="drop claw">Drop</button>
        <button id="right" type="button" aria-label="move claw right">Right</button>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
