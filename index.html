<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cat-CRANE</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="cat-CRANE game">
      <section class="hud" aria-label="game status">
        <div>
          <p class="label">Distance</p>
          <p><span id="distance">0</span>m</p>
        </div>
        <div>
          <p class="label">Swing</p>
          <p><span id="swing">0</span>°</p>
        </div>
        <button id="restart" type="button">Restart</button>
      </section>

      <canvas id="game" width="390" height="680" aria-label="cat crane play field"></canvas>

      <section class="controls" aria-label="game controls">
        <button id="brake" type="button" aria-label="apply brake">Brake</button>
        <button id="notch" type="button" aria-label="apply acceleration notch">Notch</button>
        <button id="coast" type="button" aria-label="coast without power">Coast</button>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
